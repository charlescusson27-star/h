<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --custom-btn-bg: #d97706; /* amber-600 par défaut */
            --custom-card-bg: rgba(10, 10, 10, 0.9);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans selection:bg-amber-500 selection:text-white transition-all duration-500 bg-cover bg-center bg-fixed relative overflow-hidden">

    <!-- Fond Vidéo Optionnel -->
    <div id="video-bg-container" class="hidden fixed inset-0 z-0 overflow-hidden pointer-events-none"></div>

    <!-- Lecteur Audio de Fond (Caché ou Discret) -->
    <audio id="bg-audio" loop class="hidden"></audio>

    <div id="app" class="h-full flex flex-col flex-1 backdrop-blur-sm bg-black/60 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Visionneuse / Aperçu grand format -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border border-amber-900/40 flex items-center justify-center relative">
                <div id="viewer-content-container" class="w-full h-full flex items-center justify-center"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl" id="toast-icon"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
            <div id="toast-action" class="pt-1"></div>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const SB_URL = 'https://jbenyehthydjmahpoisd.supabase.co';
        const SB_KEY = 'sb_publishable_m3b9h4bgzdTJrgFLIzSJXQ_Og-vBeOa';

        let sb = null;
        try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch(e){}

        const DB = {
            async get(k, fb) {
                try {
                    if (sb) {
                        let { data } = await sb.from('tmcv_data').select('value').eq('key', k).maybeSingle();
                        if (data?.value) return data.value;
                    }
                } catch(e){}
                let item = localStorage.getItem('leqg_' + k);
                return item ? JSON.parse(item) : fb;
            },
            async set(k, val) {
                try { if (sb) await sb.from('tmcv_data').upsert({ key: k, value: val }); } catch(e){}
                localStorage.setItem('leqg_' + k, JSON.stringify(val));
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            activeQuizId: null
        };

        async function init() {
            if (!await DB.get('users', null)) {
                await DB.set('users', [
                    { username: 'admin', lastName: 'Administrateur', password: 'admin20', role: 'admin', status: 'active', avatar: '🏰', mustChangePass: true, birthday: '2009-03-26' }
                ]);
            }
            if (!await DB.get('messages', null)) DB.set('messages', [{ id: 1, type: 'general', sender: 'admin', text: 'Bienvenue sur LE QG !', time: 'Aujourd\'hui' }]);
            if (!await DB.get('appreciations', null)) DB.set('appreciations', {});
            if (!await DB.get('custom_pages', null)) DB.set('custom_pages', []);
            if (!await DB.get('hidden_pages', null)) DB.set('hidden_pages', []);
            if (!await DB.get('custom_themes', null)) DB.set('custom_themes', []);
            if (!await DB.get('revision_sheets', null)) DB.set('revision_sheets', []);
            if (!await DB.get('exam_subjects', null)) DB.set('exam_subjects', []);
            if (!await DB.get('admin_calendar', null)) DB.set('admin_calendar', []);
            if (!await DB.get('quizzes', null)) DB.set('quizzes', []);
            if (!await DB.get('quiz_submissions', null)) DB.set('quiz_submissions', []);
            if (!await DB.get('orientation_links', null)) DB.set('orientation_links', []);
            if (!await DB.get('home_qr_image', null)) DB.set('home_qr_image', '');
            if (!await DB.get('site_colors', null)) DB.set('site_colors', { btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' });

            await applyThemeAndConfig();

            setInterval(showRefreshReminder, 600000);
            setInterval(checkAlarms, 30000);
            render();
        }

        async function applyThemeAndConfig() {
            let colors = await DB.get('site_colors', { btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' });
            document.documentElement.style.setProperty('--custom-btn-bg', colors.btnColor);
            document.documentElement.style.setProperty('--custom-card-bg', colors.cardBg);
            document.documentElement.style.setProperty('--custom-border-color', colors.borderColor);

            let bgType = await DB.get('bg_type', 'image');
            let bgVal = await DB.get('bg_value', 'https://images.unsplash.com/photo-1507783592120-a61f55877f6c?q=80&w=1920&auto=format&fit=crop');
            let body = document.getElementById('body-theme');
            let videoContainer = document.getElementById('video-bg-container');

            if (bgType === 'video') {
                body.style.backgroundImage = 'none';
                videoContainer.classList.remove('hidden');
                videoContainer.innerHTML = `<video autoplay muted loop class="w-full h-full object-cover"><source src="${bgVal}" type="video/mp4"></video>`;
            } else {
                videoContainer.classList.add('hidden');
                videoContainer.innerHTML = '';
                body.style.backgroundImage = `url('${bgVal}')`;
            }

            // Gestion Audio
            let audioData = await DB.get('bg_audio_data', null);
            let audioEl = document.getElementById('bg-audio');
            if (audioData) {
                audioEl.src = audioData;
                audioEl.volume = 0.4;
            }
        }

        function toggleAudioPlay() {
            let audioEl = document.getElementById('bg-audio');
            let btn = document.getElementById('audio-toggle-btn');
            if (audioEl.paused) {
                audioEl.play().catch(()=>{});
                if(btn) btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Musique : ON';
            } else {
                audioEl.pause();
                if(btn) btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Musique : OFF';
            }
        }

        function showRefreshReminder() {
            let user = getCurrentUser();
            if (!user) return;
            document.getElementById('toast-title').textContent = "Mise à jour disponible 🔄";
            document.getElementById('toast-msg').textContent = "Pense à actualiser ta page pour voir les dernières nouveautés et messages !";
            document.getElementById('toast-action').innerHTML = `<button onclick="location.reload()" class="px-3 py-1 dyn-btn text-black font-bold rounded-lg text-xs">Actualiser maintenant</button>`;
            document.getElementById('global-notification-toast').classList.remove('hidden');
        }

        async function checkAlarms() {
            let user = getCurrentUser();
            if (!user) return;
            let now = new Date();
            let todayStr = now.toISOString().split('T')[0];

            if (now.getHours() === 9 && now.getMinutes() === 0 && localStorage.getItem('leqg_cantine') !== todayStr) {
                showToast("Rappel Cantine 🍽️", "Pense à réserver ta cantine à la borne du hall !");
                localStorage.setItem('leqg_cantine', todayStr);
            }

            let adminEvents = await DB.get('admin_calendar', []);
            adminEvents.forEach(ev => {
                let evDate = new Date(ev.date);
                let diffTime = evDate - new Date(todayStr);
                let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                let notifKey = `class_ev_notif_${ev.id}_${todayStr}`;
                if ((diffDays === 2 || diffDays === 0) && localStorage.getItem(notifKey) !== 'true') {
                    let msg = diffDays === 0 ? `C'est aujourd'hui : "${ev.title}" 📅` : `C'est dans 2 jours : "${ev.title}" ⏳`;
                    showToast("Agenda de la Classe 📌", msg);
                    localStorage.setItem(notifKey, 'true');
                }
            });
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('leqg_current_user') || 'null');
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-action').innerHTML = '';
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 7000);
        }

        function toggleModal(id, show) {
            let el = document.getElementById(id);
            if(el) el.classList.toggle('hidden', !show);
        }

        function openFileViewer(title, dataUrl, fileType) {
            document.getElementById('viewer-title').textContent = title;
            let container = document.getElementById('viewer-content-container');
            let downloadBtn = document.getElementById('viewer-download-btn');
            downloadBtn.href = dataUrl;
            downloadBtn.download = title.replace(/\s+/g, '_') + (fileType.includes('pdf') ? '.pdf' : '.png');

            if (fileType.includes('pdf')) {
                container.innerHTML = `<embed src="${dataUrl}" type="application/pdf" width="100%" height="100%" />`;
            } else if (fileType.includes('image')) {
                container.innerHTML = `<img src="${dataUrl}" class="max-h-full max-w-full object-contain rounded-xl" />`;
            } else {
                container.innerHTML = `<div class="p-8 text-center space-y-4"><p class="text-amber-200 text-sm">Aperçu direct non disponible pour ce type de fichier.</p><a href="${dataUrl}" download class="px-4 py-2 dyn-btn text-white rounded-xl text-xs font-bold inline-block">Télécharger le fichier</a></div>`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function printFile(dataUrl, fileType) {
            let win = window.open('');
            if (fileType.includes('pdf') || fileType.includes('image')) {
                win.document.write(`<iframe src="${dataUrl}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`);
            } else {
                win.document.write(`<p>Impression directe non supportée pour ce format. Veuillez télécharger le fichier.</p>`);
            }
        }

        async function render() {
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-2xl font-bold text-red-400">Compte Désactivé</h1><p class="text-xs text-amber-200/60 mt-2">Ton accès a été temporairement suspendu par un administrateur.</p><button onclick="logout()" class="mt-4 px-5 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup();
            app.innerHTML = await renderDashboard(user);
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                <div class="p-4 bg-amber-500/10 text-amber-400 rounded-2xl text-4xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                <h1 class="text-3xl font-black text-white">LE QG</h1>
                <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                    <input type="text" id="l-user" required placeholder="Identifiant" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-amber-100">
                    <input type="password" id="l-pass" required placeholder="Mot de passe" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-amber-100">
                    <button type="submit" class="w-full py-3.5 dyn-btn text-sm text-white font-bold rounded-2xl">Se connecter</button>
                </form>
            </div></div>`;
        }

        function renderSetup() {
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6">
                <h1 class="text-xl font-bold text-amber-400">Première Connexion</h1>
                <p class="text-xs text-amber-200/70">Merci de renseigner ton nom de famille, ton mot de passe personnel et ta date d'anniversaire.</p>
                <form onsubmit="saveSetup(event)" class="space-y-4">
                    <div><label class="block text-xs text-amber-200 mb-1">Nom de famille</label><input type="text" id="s-lastname" required placeholder="Ex: Dupont" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <div><label class="block text-xs text-amber-200 mb-1">Nouveau mot de passe</label><input type="password" id="s-pass" required class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <div><label class="block text-xs text-amber-200 mb-1">Date d'anniversaire</label><input type="date" id="s-bday" required class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <button type="submit" class="w-full py-3.5 dyn-btn text-sm text-white font-bold rounded-2xl">Valider & Enregistrer</button>
                </form>
            </div></div>`;
        }

        async function renderDashboard(user) {
            let customPages = await DB.get('custom_pages', []);
            let hiddenPages = await DB.get('hidden_pages', []);
            let navs = customPages.filter(p => !hiddenPages.includes('page_' + p.id)).map(p => sbBtn('page_' + p.id, p.title, p.icon || 'file-lines')).join('');

            return `
                <header class="bg-stone-950/80 border-b border-amber-900/40 sticky top-0 z-40 px-4 py-3 flex justify-between items-center backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex items-center gap-2 font-black text-amber-400">🏰 LE QG <span class="text-xs text-amber-200/70 font-normal">(${user.username})</span></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button id="audio-toggle-btn" onclick="toggleAudioPlay()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border border-amber-900/40 flex items-center gap-1.5">
                            <i class="fa-solid fa-volume-xmark"></i> Musique : OFF
                        </button>
                        <button onclick="logout()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border border-amber-900/40">Déconnexion</button>
                    </div>
                </header>
                <div class="flex-1 flex overflow-hidden relative">
                    <aside class="fixed inset-y-0 left-0 z-30 w-72 bg-stone-950/95 border-r border-amber-900/40 transform ${state.sidebar ? 'translate-x-0' : '-translate-x-full'} transition-transform flex flex-col p-5 pt-20 shadow-2xl">
                        <nav class="space-y-1.5 flex-1 overflow-y-auto text-xs">
                            ${!hiddenPages.includes('home') ? sbBtn('home', 'Accueil & QR Code', 'house') : ''}
                            ${!hiddenPages.includes('appreciations') ? sbBtn('appreciations', 'Mes Appréciations', 'award') : ''}
                            ${!hiddenPages.includes('avatar') ? sbBtn('avatar', 'Mon Avatar & Profil', 'user-pen') : ''}
                            ${!hiddenPages.includes('chat') ? sbBtn('chat', 'Messagerie', 'comments') : ''}
                            ${!hiddenPages.includes('calendar') ? sbBtn('calendar', 'Calendrier & Agenda', 'calendar-days') : ''}
                            ${!hiddenPages.includes('quizzes') ? sbBtn('quizzes', 'Quiz & Progrès', 'brain') : ''}
                            ${!hiddenPages.includes('orientation') ? sbBtn('orientation', 'Orientation', 'compass') : ''}
                            ${!hiddenPages.includes('revisions') ? sbBtn('revisions', 'Fiches de Révision', 'book-open') : ''}
                            ${!hiddenPages.includes('exams') ? sbBtn('exams', 'Sujets Bac & Exercices', 'graduation-cap') : ''}
                            ${!hiddenPages.includes('notes') ? sbBtn('notes', 'Bloc-Notes', 'note-sticky') : ''}
                            ${navs}
                            ${user.role === 'admin' ? sbBtn('gemini', 'Gemini AI', 'sparkles', 'text-sky-400 bg-sky-500/10') : ''}
                            ${user.role === 'admin' ? sbBtn('admin', 'Administration', 'user-gear', 'text-amber-400 bg-amber-500/10') : ''}
                        </nav>
                    </aside>
                    <main class="flex-1 overflow-y-auto p-4 md:p-8">${await renderContent(user)}</main>
                </div>`;
        }

        function sbBtn(id, label, icon, extra = '') {
            let active = state.tab === id;
            return `<button onclick="state.tab='${id}';state.sidebar=false;render()" class="w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 border transition-all ${active ? 'dyn-btn text-white font-bold shadow-lg' : 'text-amber-200/80 bg-stone-900/50 border-transparent hover:bg-stone-900'} ${extra}"><i class="fa-solid fa-${icon}"></i> ${label}</button>`;
        }

        async function renderContent(user) {
            if (state.tab.startsWith('page_')) {
                let cp = (await DB.get('custom_pages', [])).find(x => x.id == state.tab.replace('page_', ''));
                return cp ? `<div class="max-w-4xl mx-auto dyn-card border p-8 space-y-4 rounded-3xl"><h2 class="text-2xl font-black text-amber-400">${cp.title}</h2><div class="text-amber-100">${cp.content}</div></div>` : '';
            }
            if (state.tab === 'home') return renderHome();
            if (state.tab === 'appreciations') return renderUserAppreciations(user);
            if (state.tab === 'chat') return renderChat(user);
            if (state.tab === 'calendar') return renderCalendar(user);
            if (state.tab === 'quizzes') return renderQuizzes(user);
            if (state.tab === 'orientation') return renderOrientation(user);
            if (state.tab === 'revisions') return renderDocPage('Fiches de Révision', await DB.get('revision_sheets', []), user);
            if (state.tab === 'exams') return renderDocPage('Sujets Bac & Exercices', await DB.get('exam_subjects', []), user);
            if (state.tab === 'avatar') return renderAvatarPage(user);
            if (state.tab === 'notes') return `<div class="max-w-3xl mx-auto dyn-card border p-6 h-[500px] flex flex-col rounded-3xl"><h2 class="text-xl font-bold text-amber-400 mb-2">Bloc-Notes</h2><textarea oninput="DB.set('note_'+ '${user.username}', this.value)" class="flex-1 w-full bg-stone-900 border border-amber-900/40 p-4 rounded-2xl text-sm text-amber-100" placeholder="Écris tes notes personnelles ici...">${localStorage.getItem('leqg_note_'+user.username)||''}</textarea></div>`;
            if (state.tab === 'gemini' && user.role === 'admin') return renderGeminiTab();
            if (state.tab === 'admin' && user.role === 'admin') return renderAdmin(user);
            return '';
        }

        function renderAvatarPage(user) {
            return `
                <div class="max-w-md mx-auto dyn-card border p-8 text-center space-y-6 rounded-3xl">
                    <div class="text-7xl">${user.avatar || '🏰'}</div>
                    <div class="space-y-2">
                        <h2 class="text-xl font-black text-amber-400">Personnaliser ton Avatar</h2>
                        <p class="text-xs text-amber-200/70">Tape ou colle un unique émoji de ton choix dans la zone ci-dessous :</p>
                    </div>
                    <form onsubmit="saveEmojiAvatar(event)" class="space-y-4">
                        <input type="text" id="avatar-emoji-input" maxlength="4" value="${user.avatar || '🏰'}" required class="w-24 mx-auto text-center text-4xl p-2 bg-stone-900 border border-amber-900/40 rounded-2xl block text-amber-100">
                        <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Enregistrer mon émoji</button>
                    </form>
                </div>`;
        }

        async function saveEmojiAvatar(e) {
            e.preventDefault();
            let val = document.getElementById('avatar-emoji-input').value.trim();
            if(!val) return;
            let user = getCurrentUser();
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === user.username);
            if(idx !== -1) {
                users[idx].avatar = val;
                await DB.set('users', users);
                localStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                showToast("Succès", "Ton avatar émoji a été mis à jour !");
                render();
            }
        }

        async function renderHome() {
            let qrImage = await DB.get('home_qr_image', '');
            return `
                <div class="max-w-3xl mx-auto space-y-6 text-center">
                    <div class="dyn-card border p-8 space-y-4 rounded-3xl">
                        <h2 class="text-3xl font-black text-white">Bienvenue sur LE QG !</h2>
                        <p class="text-amber-200/80 text-sm">Ton espace collaboratif de lycée.</p>
                    </div>

                    <div class="dyn-card border p-8 space-y-4 rounded-3xl">
                        <h3 class="text-xl font-black text-amber-400"><i class="fa-solid fa-mobile-screen-button mr-2"></i>Accès & Installation Smartphone</h3>
                        ${qrImage ? `
                            <p class="text-xs text-amber-200/70">Scanne ce QR Code officiel pour ouvrir l'application directement sur ton smartphone :</p>
                            <div class="bg-white p-4 inline-block rounded-2xl shadow-xl border-4 border-amber-500">
                                <img src="${qrImage}" alt="QR Code LE QG" width="170" height="170" class="mx-auto block object-contain" />
                            </div>
                        ` : `
                            <div class="p-6 bg-stone-900/60 border border-amber-900/30 rounded-2xl text-amber-200/60 text-xs italic">
                                <i class="fa-solid fa-triangle-exclamation mr-1 text-amber-400"></i> Aucun QR code n'a encore été déposé par l'administrateur.
                            </div>
                        `}
                    </div>
                </div>`;
        }

        async function renderUserAppreciations(user) {
            let allAppreciations = await DB.get('appreciations', {});

        async function addPersonalEvent(e) {
            e.preventDefault();
            let title = document.getElementById('ev-title').value;
            let date = document.getElementById('ev-date').value;
            let user = getCurrentUser();
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === user.username);
            if(idx !== -1) {
                if(!users[idx].personalCalendar) users[idx].personalCalendar = [];
                users[idx].personalCalendar.push({ id: Date.now(), title, date });
                await DB.set('users', users);
                localStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        async function deletePersonalEvent(eventIndex) {
            let user = getCurrentUser();
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === user.username);
            if(idx !== -1 && users[idx].personalCalendar) {
                users[idx].personalCalendar.splice(eventIndex, 1);
                await DB.set('users', users);
                localStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        async function createStudentAccount(e) {
            e.preventDefault();
            let username = document.getElementById('nu-user').value.trim();
            let lastName = document.getElementById('nu-lastname').value.trim();
            let password = document.getElementById('nu-pass').value.trim();

            let users = await DB.get('users', []);
            if (users.some(u => u.username === username)) return alert("Cet identifiant existe déjà.");

            users.push({
                username,
                lastName,
                password,
                role: 'student',
                status: 'active',
                avatar: '🎓',
                mustChangePass: true,
                birthday: ''
            });

            await DB.set('users', users);
            showToast("Succès", `Compte élève pour ${username} créé !`);
            render();
        }

        async function toggleUserStatus(username) {
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === username);
            if(idx !== -1) {
                users[idx].status = users[idx].status === 'masked' ? 'active' : 'masked';
                await DB.set('users', users);
                render();
            }
        }

        async function deleteStudentAccount(username) {
            if(!confirm(`Êtes-vous sûr de vouloir supprimer définitivement le compte de ${username} ?`)) return;
            let users = await DB.get('users', []);
            users = users.filter(u => u.username !== username);
            await DB.set('users', users);
            showToast("Supprimé", `Le compte de ${username} a été supprimé.`);
            render();
        }

        async function resetUserPassword(username) {
            let nPass = prompt(`Entrez le nouveau mot de passe temporaire pour ${username} :`);
            if(!nPass) return;
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === username);
            if(idx !== -1) {
                users[idx].password = nPass;
                users[idx].mustChangePass = true;
                await DB.set('users', users);
                alert(`Mot de passe de ${username} réinitialisé.`);
                render();
            }
        }

                <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-amber-300 text-sm">Gestion des Appréciations Trimestrielles</h3>
                        <p class="text-[10px] text-amber-200/50">Tape tes appréciations et valide pour publier la fiche de chaque élève.</p>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs text-amber-100 border-collapse">
                            <thead>
                                <tr class="border-b border-amber-900/40 text-amber-400">
                                    <th class="p-3">Élève</th>
                                    <th class="p-3">Trimestre 1</th>
                                    <th class="p-3">Trimestre 2</th>
                                    <th class="p-3">Trimestre 3</th>
                                    <th class="p-3 text-center">Publier</th>
                                    <th class="p-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${students.map(s => {
                                    let app = appreciations[s.username] || { t1: '', t2: '', t3: '', published: false };
                                    return `
                                        <tr class="border-b border-amber-900/20 bg-stone-900/40">
                                            <td class="p-3 font-bold text-amber-300">${s.username} <span class="block text-[10px] text-amber-200/50 font-normal">${s.lastName||''}</span></td>
                                            <td class="p-2"><textarea id="app_t1_${s.username}" class="w-full p-2 bg-stone-900 border border-amber-900/40 rounded-xl text-xs">${app.t1||''}</textarea></td>
                                            <td class="p-2"><textarea id="app_t2_${s.username}" class="w-full p-2 bg-stone-900 border border-amber-900/40 rounded-xl text-xs">${app.t2||''}</textarea></td>
                                            <td class="p-2"><textarea id="app_t3_${s.username}" class="w-full p-2 bg-stone-900 border border-amber-900/40 rounded-xl text-xs">${app.t3||''}</textarea></td>
                                            <td class="p-3 text-center">
                                                <input type="checkbox" id="app_pub_${s.username}" ${app.published ? 'checked' : ''} class="w-4 h-4 text-amber-600 rounded">
                                            </td>
                                            <td class="p-3 text-right">
                                                <button onclick="saveStudentAppreciation('${s.username}')" class="px-3 py-1.5 dyn-btn text-white rounded-xl font-bold text-xs">Enregistrer</button>
                                            </td>
                                        </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        async function saveStudentAppreciation(username) {
            let appreciations = await DB.get('appreciations', {});
            appreciations[username] = {
                t1: document.getElementById(`app_t1_${username}`).value,
                t2: document.getElementById(`app_t2_${username}`).value,
                t3: document.getElementById(`app_t3_${username}`).value,
                published: document.getElementById(`app_pub_${username}`).checked
            };
            await DB.set('appreciations', appreciations);
            showToast("Enregistré", `Appréciations de ${username} enregistrées !`);
        }

        async function renderAdminCalendar() {
            let adminEvents = await DB.get('admin_calendar', []);
            adminEvents.sort((a, b) => new Date(a.date) - new Date(b.date));

            return `
                <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                    <h3 class="font-bold text-amber-300 text-sm">Ajouter un événement dans l'Agenda de la Classe</h3>
                    <form onsubmit="addAdminCalendarEvent(event)" class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input type="text" id="admin-ev-title" required placeholder="Titre de l'événement..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="date" id="admin-ev-date" required class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                        </div>
                        <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Publier l'événement pour toute la classe</button>
                    </form>
                    <div class="space-y-2 mt-4 max-h-64 overflow-y-auto">
                        ${adminEvents.length > 0 ? adminEvents.map((ev, i) => `
                            <div class="p-3 bg-stone-900 rounded-xl flex justify-between items-center text-xs">
                                <div><p class="font-bold text-amber-100">${ev.title}</p><p class="text-[10px] text-amber-200/50">${ev.date}</p></div>
                                <button onclick="deleteAdminCalendarEvent(${i})" class="px-3 py-1 bg-red-600/30 text-red-300 rounded-lg font-bold">Supprimer</button>
                            </div>
                        `).join('') : '<p class="text-xs text-amber-200/40 italic">Aucun événement de classe enregistré.</p>'}
                    </div>
                </div>`;
        }

        async function addAdminCalendarEvent(e) {
            e.preventDefault();
            let title = document.getElementById('admin-ev-title').value.trim();
            let date = document.getElementById('admin-ev-date').value;
            let events = await DB.get('admin_calendar', []);
            events.push({ id: Date.now(), title, date });
            events.sort((a, b) => new Date(a.date) - new Date(b.date));
            await DB.set('admin_calendar', events);
            showToast("Succès", "Événement ajouté à l'agenda de la classe !");
            render();
        }

        async function deleteAdminCalendarEvent(index) {
            if(!confirm("Supprimer cet événement de l'agenda commun ?")) return;
            let events = await DB.get('admin_calendar', []);
            events.sort((a, b) => new Date(a.date) - new Date(b.date));
            events.splice(index, 1);
            await DB.set('admin_calendar', events);
            render();
        }

        async function renderAdminOrientation() {
            let links = await DB.get('orientation_links', []);
            return `
                <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                    <h3 class="font-bold text-amber-300 text-sm">Ajouter un lien / site d'Orientation</h3>
                    <form onsubmit="addOrientationLink(event)" class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" id="ori-title" required placeholder="Titre (ex: Parcoursup)..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="text" id="ori-sitename" required placeholder="Nom du site..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="url" id="ori-url" required placeholder="URL directe (https://...)" class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                        </div>
                        <input type="url" id="ori-preview" placeholder="URL de l'image d'aperçu (optionnel)..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                        <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Ajouter la ressource Orientation</button>
                    </form>
                    <div class="space-y-2 mt-4 max-h-64 overflow-y-auto">
                        ${links.length > 0 ? links.map((l, i) => `
                            <div class="p-3 bg-stone-900 rounded-xl flex justify-between items-center text-xs">
                                <div><p class="font-bold text-amber-100">${l.title} <span class="text-amber-200/50">(${l.siteName})</span></p><a href="${l.url}" target="_blank" class="text-sky-400 truncate max-w-xs block">${l.url}</a></div>
                                <button onclick="deleteOrientationLink(${i})" class="px-3 py-1 bg-red-600/30 text-red-300 rounded-lg font-bold">Supprimer</button>
                            </div>
                        `).join('') : '<p class="text-xs text-amber-200/40 italic">Aucun lien d\'orientation enregistré.</p>'}
                    </div>
                </div>`;
        }

        async function addOrientationLink(e) {
            e.preventDefault();
            let title = document.getElementById('ori-title').value.trim();
            let siteName = document.getElementById('ori-sitename').value.trim();
            let url = document.getElementById('ori-url').value.trim();
            let previewImg = document.getElementById('ori-preview').value.trim();

            let links = await DB.get('orientation_links', []);
            links.push({ id: Date.now(), title, siteName, url, previewImg });
            await DB.set('orientation_links', links);
            showToast("Succès", "Lien d'orientation ajouté !");
            render();
        }

        async function deleteOrientationLink(index) {
            let links = await DB.get('orientation_links', []);
            links.splice(index, 1);
            await DB.set('orientation_links', links);
            render();
        }

        async function renderAdminDocs() {
            let revSheets = await DB.get('revision_sheets', []);
            let examSubjects = await DB.get('exam_subjects', []);

            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                        <h3 class="font-bold text-amber-300 text-sm">Ajouter une Fiche de Révision</h3>
                        <form onsubmit="uploadDocItem(event, 'revision_sheets')" class="space-y-3">
                            <input type="text" id="doc-title-rev" required placeholder="Titre de la fiche..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="text" id="doc-desc-rev" placeholder="Description courte..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="file" id="doc-file-rev" required accept=".pdf,image/*" class="w-full p-2 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white cursor-pointer">
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Uploader la Fiche</button>
                        </form>
                        <div class="space-y-2 mt-4 max-h-48 overflow-y-auto">
                            ${revSheets.map((d, i) => `
                                <div class="p-3 bg-stone-900 rounded-xl flex justify-between items-center text-xs">
                                    <span class="font-bold text-amber-100 truncate">${d.title}</span>
                                    <button onclick="deleteDocItem('revision_sheets', ${i})" class="px-2.5 py-1 bg-red-600/30 text-red-300 rounded-lg">Supprimer</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                        <h3 class="font-bold text-amber-300 text-sm">Ajouter un Sujet ou Corrigé</h3>
                        <form onsubmit="uploadDocItem(event, 'exam_subjects')" class="space-y-3">
                            <input type="text" id="doc-title-exam" required placeholder="Titre..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="text" id="doc-desc-exam" placeholder="Description courte..." class="w-full p-3 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            <input type="file" id="doc-file-exam" required accept=".pdf,image/*" class="w-full p-2 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white cursor-pointer">
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Uploader le Document</button>
                        </form>
                        <div class="space-y-2 mt-4 max-h-48 overflow-y-auto">
                            ${examSubjects.map((d, i) => `
                                <div class="p-3 bg-stone-900 rounded-xl flex justify-between items-center text-xs">
                                    <span class="font-bold text-amber-100 truncate">${d.title}</span>
                                    <button onclick="deleteDocItem('exam_subjects', ${i})" class="px-2.5 py-1 bg-red-600/30 text-red-300 rounded-lg">Supprimer</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
        }

        async function uploadDocItem(e, dbKey) {
            e.preventDefault();
            let isRev = dbKey === 'revision_sheets';
            let title = document.getElementById(isRev ? 'doc-title-rev' : 'doc-title-exam').value.trim();
            let desc = document.getElementById(isRev ? 'doc-desc-rev' : 'doc-desc-exam').value.trim();
            let fileInput = document.getElementById(isRev ? 'doc-file-rev' : 'doc-file-exam');

            if (!fileInput.files || fileInput.files.length === 0) return alert("Veuillez sélectionner un fichier.");

            let file = fileInput.files[0];
            let reader = new FileReader();

            reader.onload = async function(ev) {
                let fileData = ev.target.result;
                let fileType = file.type;

                let items = await DB.get(dbKey, []);
                items.push({ id: Date.now(), title, desc, fileData, fileType });
                await DB.set(dbKey, items);

                showToast("Succès", "Document uploadé avec succès !");
                render();
            };

            reader.readAsDataURL(file);
        }

        async function deleteDocItem(dbKey, index) {
            if (!confirm("Voulez-vous vraiment supprimer ce document ?")) return;
            let items = await DB.get(dbKey, []);
            items.splice(index, 1);
            await DB.set(dbKey, items);
            render();
        }

        async function renderAdminAppearance() {
            let currentBgType = await DB.get('bg_type', 'image');
            let currentBgVal = await DB.get('bg_value', '');
            let currentColors = await DB.get('site_colors', { btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' });

            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Fonds & QR Code -->
                    <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                        <h3 class="font-bold text-amber-300 text-sm">Arrière-plan (Image ou Vidéo) & QR Code</h3>
                        <form onsubmit="saveBackgroundConfig(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-amber-200 mb-1">Type de fond</label>
                                <select id="admin-bg-type" class="w-full p-2.5 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                                    <option value="image" ${currentBgType==='image'?'selected':''}>Image / Lien Web (Canva, Unsplash...)</option>
                                    <option value="video" ${currentBgType==='video'?'selected':''}>Vidéo en boucle (Lien MP4)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-amber-200 mb-1">URL de l'image ou de la vidéo</label>
                                <input type="url" id="admin-bg-val" value="${currentBgVal}" required placeholder="https://..." class="w-full p-2.5 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            </div>
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Appliquer le Fond</button>
                        </form>

                        <div class="pt-4 border-t border-amber-900/40 space-y-2">
                            <label class="block font-bold text-amber-200 text-xs">Mettre à jour le QR Code de l'accueil (Fichier image)</label>
                            <input type="file" id="admin-qr-file" accept="image/*" class="w-full p-2 bg-stone-950 border border-amber-900/40 rounded-xl text-xs text-amber-100 file:py-1 file:px-3 file:rounded file:bg-amber-600 file:text-white cursor-pointer">
                            <button onclick="uploadAdminQrFile()" class="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Mettre à jour le QR Code</button>
                        </div>
                    </div>

                    <!-- Couleurs & Musique de fond -->
                    <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                        <h3 class="font-bold text-amber-300 text-sm">Couleurs du Site & Musique Privée</h3>
                        <form onsubmit="saveColorsConfig(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-amber-200 mb-1">Couleur principale des boutons (Bouton d'action)</label>
                                <input type="color" id="admin-color-btn" value="${currentColors.btnColor}" class="w-full h-10 bg-stone-900 border border-amber-900/40 rounded-xl p-1 cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-amber-200 mb-1">Fond des cartes / fenêtres</label>
                                <input type="text" id="admin-color-card" value="${currentColors.cardBg}" placeholder="ex: rgba(10, 10, 10, 0.9)" class="w-full p-2.5 bg-stone-900 border border-amber-900/40 rounded-xl text-xs text-amber-100">
                            </div>
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Appliquer les Couleurs</button>
                        </form>

                        <div class="pt-4 border-t border-amber-900/40 space-y-2">
                            <label class="block font-bold text-amber-200 text-xs">Uploader une musique de fond (Fichier Audio)</label>
                            <input type="file" id="admin-audio-file" accept="audio/*" class="w-full p-2 bg-stone-950 border border-amber-900/40 rounded-xl text-xs text-amber-100 file:py-1 file:px-3 file:rounded file:bg-amber-600 file:text-white cursor-pointer">
                            <button onclick="uploadAdminAudioFile()" class="w-full py-2 bg-sky-600 text-white rounded-xl text-xs font-bold">Enregistrer la Musique</button>
                        </div>
                    </div>
                </div>`;
        }

        async function saveBackgroundConfig(e) {
            e.preventDefault();
            let type = document.getElementById('admin-bg-type').value;
            let val = document.getElementById('admin-bg-val').value.trim();
            await DB.set('bg_type', type);
            await DB.set('bg_value', val);
            await applyThemeAndConfig();
            showToast("Succès", "Arrière-plan mis à jour !");
        }

        async function saveColorsConfig(e) {
            e.preventDefault();
            let btnColor = document.getElementById('admin-color-btn').value;
            let cardBg = document.getElementById('admin-color-card').value.trim();
            let newColors = { btnColor, cardBg, borderColor: 'rgba(245, 158, 11, 0.4)' };
            await DB.set('site_colors', newColors);
            await applyThemeAndConfig();
            showToast("Succès", "Les couleurs du site ont été appliquées !");
            render();
        }

        async function uploadAdminAudioFile() {
            let fileInput = document.getElementById('admin-audio-file');
            if (!fileInput.files || fileInput.files.length === 0) return alert("Veuillez sélectionner un fichier audio.");
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = async function(e) {
                await DB.set('bg_audio_data', e.target.result);
                await applyThemeAndConfig();
                showToast("Succès", "Musique de fond enregistrée ! Active-la en haut du site.");
            };
            reader.readAsDataURL(file);
        }

        async function uploadAdminQrFile() {
            let fileInput = document.getElementById('admin-qr-file');
            if (!fileInput.files || fileInput.files.length === 0) return alert("Veuillez sélectionner un fichier image.");
            let reader = new FileReader();
            reader.onload = async function(e) {
                await DB.set('home_qr_image', e.target.result);
                showToast("Succès", "QR code mis à jour !");
                render();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        async function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('l-user').value.trim();
            let p = document.getElementById('l-pass').value.trim();

            let users = await DB.get('users', []);
            let user = users.find(x => x.username === u && x.password === p);

            if (user) {
                localStorage.setItem('leqg_current_user', JSON.stringify(user));
                render();
            } else {
                alert("Identifiant ou mot de passe incorrect");
            }
        }

        async function saveSetup(e) {
            e.preventDefault();
            let lastName = document.getElementById('s-lastname').value.trim();
            let pass = document.getElementById('s-pass').value;
            let bday = document.getElementById('s-bday').value;

            let user = getCurrentUser();
            let users = await DB.get('users', []);
            let idx = users.findIndex(u => u.username === user.username);

            if (idx !== -1) {
                users[idx].lastName = lastName;
                users[idx].password = pass;
                users[idx].birthday = bday;
                users[idx].mustChangePass = false;
                await DB.set('users', users);
                localStorage.setItem('leqg_current_user', JSON.stringify(users[idx]));
                render();
            }
        }

        function logout() {
            localStorage.removeItem('leqg_current_user');
            render();
        }

        window.onload = init;
    </script>
</body>
</html>
