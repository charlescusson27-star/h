<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE QG - Espace Collaboratif Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Firebase v10 (Version compat pour Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --custom-btn-bg: #d97706;
            --custom-card-bg: rgba(10, 10, 10, 0.9);
            --custom-border-color: rgba(245, 158, 11, 0.4);
        }
        .dyn-btn { background-color: var(--custom-btn-bg) !important; }
        .dyn-btn:hover { filter: brightness(1.15); }
        .dyn-card { background-color: var(--custom-card-bg) !important; border-color: var(--custom-border-color) !important; }
    </style>
</head>
<body id="body-theme" class="bg-stone-950 text-amber-50 h-full flex flex-col font-sans selection:bg-amber-500 selection:text-white transition-all duration-500 bg-cover bg-center bg-fixed relative overflow-hidden">

    <div id="video-bg-container" class="hidden fixed inset-0 z-0 overflow-hidden pointer-events-none"></div>
    <audio id="bg-audio" loop class="hidden"></audio>

    <div id="app" class="h-full flex flex-col flex-1 backdrop-blur-sm bg-black/60 z-10 relative overflow-hidden">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de LE QG...</p>
            </div>
        </div>
    </div>

    <!-- Modal Visionneuse -->
    <div id="file-viewer-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl h-[85vh] dyn-card border rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-amber-900/40 pb-3">
                <h3 id="viewer-title" class="font-black text-lg text-amber-400">Aperçu du Document</h3>
                <div class="flex gap-2 items-center">
                    <a id="viewer-download-btn" href="#" download class="px-3 py-1.5 dyn-btn text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-download"></i> Télécharger</a>
                    <button onclick="toggleModal('file-viewer-modal', false)" class="text-amber-200/70 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div class="flex-1 bg-stone-900 rounded-2xl overflow-hidden border border-amber-900/40 flex items-center justify-center relative">
                <div id="viewer-content-container" class="w-full h-full flex items-center justify-center"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Global -->
    <div id="global-notification-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-sm dyn-card border-2 border-amber-500 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
        <div class="text-amber-400 text-2xl" id="toast-icon"><i class="fa-solid fa-bell"></i></div>
        <div class="flex-1 space-y-1">
            <h4 class="font-bold text-xs text-amber-300" id="toast-title">LE QG</h4>
            <p class="text-xs text-amber-100" id="toast-msg"></p>
            <div id="toast-action" class="pt-1"></div>
        </div>
        <button onclick="toggleModal('global-notification-toast', false)" class="text-amber-200/50"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDQp8qnPJ64u0dBMaSnOZN31BV30QaHz3k",
            authDomain: "lqgp-9d3e0.firebaseapp.com",
            projectId: "lqgp-9d3e0",
            storageBucket: "lqgp-9d3e0.firebasestorage.app",
            messagingSenderId: "542617927378",
            appId: "1:542617927378:web:90aeb0b57805dabf27b70b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // E-mail officiel du délégué configuré (sans point)
        const ADMIN_EMAIL = "charlescusson27@gmail.com";

        const DB = {
            async get(k, fb) {
                try {
                    let docRef = db.collection("leqg_data").doc(k);
                    let doc = await docRef.get();
                    if (doc.exists) return doc.data().value;
                } catch(e) { console.error("Erreur Firebase GET pour", k, e); }
                let item = localStorage.getItem('leqg_' + k);
                return item ? JSON.parse(item) : fb;
            },
            async set(k, val) {
                try { await db.collection("leqg_data").doc(k).set({ value: val }); } catch(e) { console.error("Erreur Firebase SET pour", k, e); }
                localStorage.setItem('leqg_' + k, JSON.stringify(val));
            }
        };

        let state = {
            tab: 'home',
            sidebar: false,
            chatMode: 'general',
            targetUser: null,
            adminSub: 'users',
            mailSubBox: 'inbox', // inbox, sent, drafts, archives
            activeQuizId: null
        };

        let countdownInterval = null;

        async function init() {
            if (!await DB.get('users', null)) {
                await DB.set('users', [
                    { username: 'admin', lastName: 'Délégué', password: 'admin20', role: 'admin', status: 'active', avatar: { base: '🏰', style: 'bg-amber-600', accessory: '👑' }, mustChangePass: true, birthday: '2009-03-26', email: ADMIN_EMAIL }
                ]);
            }
            if (!await DB.get('messages', null)) DB.set('messages', [{ id: 1, type: 'general', sender: 'admin', text: 'Bienvenue sur LE QG !', time: 'Aujourd\'hui' }]);
            if (!await DB.get('appreciations', null)) DB.set('appreciations', {});
            if (!await DB.get('custom_pages', null)) DB.set('custom_pages', []);
            if (!await DB.get('hidden_pages', null)) DB.set('hidden_pages', []);
            if (!await DB.get('revision_sheets', null)) DB.set('revision_sheets', []);
            if (!await DB.get('exam_subjects', null)) DB.set('exam_subjects', []);
            if (!await DB.get('admin_calendar', null)) DB.set('admin_calendar', []);
            if (!await DB.get('quizzes', null)) DB.set('quizzes', []);
            if (!await DB.get('quiz_submissions', null)) DB.set('quiz_submissions', {});
            if (!await DB.get('orientation_links', null)) DB.set('orientation_links', []);
            if (!await DB.get('ideas_board', null)) DB.set('ideas_board', []);
            if (!await DB.get('mail_inbox', null)) DB.set('mail_inbox', []);
            if (!await DB.get('mail_sent', null)) DB.set('mail_sent', []);
            if (!await DB.get('mail_drafts', null)) DB.set('mail_drafts', []);
            if (!await DB.get('mail_archives', null)) DB.set('mail_archives', []);
            if (!await DB.get('countdowns', null)) DB.set('countdowns', [
                { id: 1, title: 'Épreuves du Bac Pro', date: '2026-06-15T08:00' }
            ]);
            if (!await DB.get('home_qr_image', null)) DB.set('home_qr_image', '');
            if (!await DB.get('site_colors', null)) DB.set('site_colors', { btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' });

            await applyThemeAndConfig();
            checkBirthdaysToday();
            
            // Synchronisation silencieuse toutes les 60 secondes en arrière-plan sans perturber l'utilisateur
            setInterval(backgroundSyncToFirebase, 60000);
            setInterval(showRefreshReminder, 600000);
            setInterval(checkAlarms, 30000);
            render();
        }

        async function backgroundSyncToFirebase() {
            try {
                let keys = ['users', 'messages', 'ideas_board', 'countdowns', 'quizzes', 'mail_inbox', 'mail_sent', 'mail_drafts', 'mail_archives'];
                for (let k of keys) {
                    let val = localStorage.getItem('leqg_' + k);
                    if (val) {
                        await db.collection("leqg_data").doc(k).set({ value: JSON.parse(val) });
                    }
                }
            } catch(e) {
                console.error("Erreur synchro arrière-plan:", e);
            }
        }

        async function checkBirthdaysToday() {
            let user = getCurrentUser();
            if (!user || user.role !== 'admin') return;
            let users = await DB.get('users', []);
            let today = new Date().toISOString().split('T')[0].slice(5); // MM-DD
            let lastChecked = localStorage.getItem('leqg_bday_checked');

            if (lastChecked !== today) {
                users.forEach(u => {
                    if (u.birthday && u.birthday.slice(5) === today) {
                        let birthYear = parseInt(u.birthday.split('-')[0]);
                        let age = new Date().getFullYear() - birthYear;
                        let msgText = `C'est l'anniversaire de ${u.username} (${u.lastName || ''}) aujourd'hui (${age} ans) !`;
                        showToast("Joyeux Anniversaire ! 🎂", msgText);
                        
                        // Ajouter automatiquement dans la boîte de réception comme notification système avec ticket
                        addSystemNotificationToInbox("Notification Anniversaire 🎂", msgText);
                    }
                });
                localStorage.setItem('leqg_bday_checked', today);
            }
        }

        async function addSystemNotificationToInbox(title, text) {
            let inbox = await DB.get('mail_inbox', []);
            let ticket = "#QG-" + Math.floor(1000 + Math.random() * 9000);
            inbox.unshift({
                ticket: ticket,
                sender: "Système QG",
                email: ADMIN_EMAIL,
                subject: title,
                text: text,
                date: new Date().toLocaleDateString() + ' à ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            await DB.set('mail_inbox', inbox);
        }

        async function applyThemeAndConfig() {
            let colors = await DB.get('site_colors', { btnColor: '#d97706', cardBg: 'rgba(10, 10, 10, 0.9)', borderColor: 'rgba(245, 158, 11, 0.4)' });
            document.documentElement.style.setProperty('--custom-btn-bg', colors.btnColor);
            document.documentElement.style.setProperty('--custom-card-bg', colors.cardBg);
            document.documentElement.style.setProperty('--custom-border-color', colors.borderColor);

            let bgType = await DB.get('bg_type', 'image');
            let bgVal = await DB.get('bg_value', 'https://images.unsplash.com/photo-1507783592120-a61f55877f6c?q=80&w=1920&auto=format&fit=crop');
            let body = document.getElementById('body-theme');
            let videoContainer = document.getElementById('video-bg-container');

            if (bgType === 'video') {
                body.style.backgroundImage = 'none';
                videoContainer.classList.remove('hidden');
                videoContainer.innerHTML = `<video autoplay muted loop class="w-full h-full object-cover"><source src="${bgVal}" type="video/mp4"></video>`;
            } else {
                videoContainer.classList.add('hidden');
                videoContainer.innerHTML = '';
                body.style.backgroundImage = `url('${bgVal}')`;
            }

            let audioData = await DB.get('bg_audio_data', null);
            let audioEl = document.getElementById('bg-audio');
            if (audioData) { audioEl.src = audioData; audioEl.volume = 0.4; }
        }

        function toggleAudioPlay() {
            let audioEl = document.getElementById('bg-audio');
            let btn = document.getElementById('audio-toggle-btn');
            if (audioEl.paused) {
                audioEl.play().catch(()=>{});
                if(btn) btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Musique : ON';
            } else {
                audioEl.pause();
                if(btn) btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Musique : OFF';
            }
        }

        function showRefreshReminder() {
            let user = getCurrentUser();
            if (!user) return;
            document.getElementById('toast-title').textContent = "Mise à jour disponible 🔄";
            document.getElementById('toast-msg').textContent = "Pense à actualiser ta page pour voir les dernières nouveautés !";
            document.getElementById('toast-action').innerHTML = `<button onclick="location.reload()" class="px-3 py-1 dyn-btn text-black font-bold rounded-lg text-xs">Actualiser</button>`;
            document.getElementById('global-notification-toast').classList.remove('hidden');
        }

        async function checkAlarms() {
            let user = getCurrentUser();
            if (!user) return;
            let now = new Date();
            let todayStr = now.toISOString().split('T')[0];
            if (now.getHours() === 9 && now.getMinutes() === 0 && localStorage.getItem('leqg_cantine') !== todayStr) {
                showToast("Rappel Cantine 🍽️", "Pense à réserver ta cantine à la borne du hall !");
                localStorage.setItem('leqg_cantine', todayStr);
            }
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('leqg_current_user') || 'null');
        }

        function showToast(title, msg) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-action').innerHTML = '';
            document.getElementById('global-notification-toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('global-notification-toast').classList.add('hidden'), 7000);
        }

        function toggleModal(id, show) {
            let el = document.getElementById(id);
            if(el) el.classList.toggle('hidden', !show);
        }

        function openFileViewer(title, dataUrl, fileType) {
            document.getElementById('viewer-title').textContent = title;
            let container = document.getElementById('viewer-content-container');
            let downloadBtn = document.getElementById('viewer-download-btn');
            downloadBtn.href = dataUrl;
            downloadBtn.download = title.replace(/\s+/g, '_') + (fileType.includes('pdf') ? '.pdf' : '.png');

            if (fileType.includes('pdf')) {
                container.innerHTML = `<embed src="${dataUrl}" type="application/pdf" width="100%" height="100%" />`;
            } else if (fileType.includes('image')) {
                container.innerHTML = `<img src="${dataUrl}" class="max-h-full max-w-full object-contain rounded-xl" />`;
            } else {
                container.innerHTML = `<div class="p-8 text-center space-y-4"><p class="text-amber-200 text-sm">Aperçu non disponible.</p><a href="${dataUrl}" download class="px-4 py-2 dyn-btn text-white rounded-xl text-xs font-bold inline-block">Télécharger</a></div>`;
            }
            toggleModal('file-viewer-modal', true);
        }

        function renderAvatarHtml(av) {
            if (!av) return '<span class="text-3xl">🏰</span>';
            if (typeof av === 'string') return `<span class="text-3xl">${av}</span>`;
            return `<div class="relative inline-flex items-center justify-center w-14 h-14 rounded-2xl ${av.style || 'bg-amber-600'} border-2 border-amber-400 shadow-lg text-2xl">
                <span>${av.base || '🏰'}</span>
                <span class="absolute -bottom-1 -right-1 text-xs bg-black/80 px-1 rounded-full border border-amber-500">${av.accessory || ''}</span>
            </div>`;
        }

        async function render() {
            if (countdownInterval) clearInterval(countdownInterval);
            let app = document.getElementById('app'), user = getCurrentUser();
            if (!user) return app.innerHTML = renderLogin();
            if (user.status === 'masked') return app.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center"><h1 class="text-2xl font-bold text-red-400">Compte Désactivé</h1><p class="text-xs text-amber-200/60 mt-2">Ton accès a été suspendu.</p><button onclick="logout()" class="mt-4 px-5 py-2 dyn-btn text-white rounded-xl text-xs">Déconnexion</button></div>`;
            if (user.mustChangePass) return app.innerHTML = renderSetup();
            app.innerHTML = await renderDashboard(user);

            if (state.tab === 'home') {
                startCountdownsTimer();
            }
        }

        function renderLogin() {
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6 text-center">
                <div class="p-4 bg-amber-500/10 text-amber-400 rounded-2xl text-4xl inline-block"><i class="fa-solid fa-chess-rook"></i></div>
                <h1 class="text-3xl font-black text-white">LE QG</h1>
                <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                    <input type="text" id="l-user" required placeholder="Identifiant" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-amber-100">
                    <input type="password" id="l-pass" required placeholder="Mot de passe" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-amber-100">
                    <button type="submit" class="w-full py-3.5 dyn-btn text-sm text-white font-bold rounded-2xl">Se connecter</button>
                </form>
            </div></div>`;
        }

        function renderSetup() {
            return `<div class="flex-1 flex items-center justify-center p-4"><div class="w-full max-w-md dyn-card border rounded-3xl p-8 shadow-2xl space-y-6">
                <h1 class="text-xl font-bold text-amber-400">Première Connexion</h1>
                <p class="text-xs text-amber-200/70">Merci de renseigner ton nom, ton mot de passe et ta date d'anniversaire.</p>
                <form onsubmit="saveSetup(event)" class="space-y-4">
                    <div><label class="block text-xs text-amber-200 mb-1">Nom de famille</label><input type="text" id="s-lastname" required placeholder="Ex: Dupont" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <div><label class="block text-xs text-amber-200 mb-1">Adresse e-mail <span class="text-amber-400 font-bold">(Facultatif mais recommandé pour recevoir les notifications)</span></label><input type="email" id="s-email" placeholder="prenom.nom@lycee.fr" class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <div><label class="block text-xs text-amber-200 mb-1">Nouveau mot de passe</label><input type="password" id="s-pass" required class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <div><label class="block text-xs text-amber-200 mb-1">Date d'anniversaire</label><input type="date" id="s-bday" required class="w-full px-4 py-3 bg-stone-900 border border-amber-900/50 rounded-2xl text-sm text-white"></div>
                    <button type="submit" class="w-full py-3.5 dyn-btn text-sm text-white font-bold rounded-2xl">Valider & Enregistrer</button>
                </form>
            </div></div>`;
        }

        async function renderDashboard(user) {
            let customPages = await DB.get('custom_pages', []);
            let hiddenPages = await DB.get('hidden_pages', []);
            let navs = customPages.filter(p => !hiddenPages.includes('page_' + p.id)).map(p => sbBtn('page_' + p.id, p.title, p.icon || 'file-lines')).join('');

            return `
                <header class="bg-stone-950/80 border-b border-amber-900/40 sticky top-0 z-40 px-4 py-3 flex justify-between items-center backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <button onclick="state.sidebar=!state.sidebar;render()" class="p-2 bg-stone-900 text-amber-100 rounded-xl"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex items-center gap-2 font-black text-amber-400">🏰 LE QG <span class="text-xs text-amber-200/70 font-normal">(${user.username})</span></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button id="audio-toggle-btn" onclick="toggleAudioPlay()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border border-amber-900/40 flex items-center gap-1.5">
                            <i class="fa-solid fa-volume-xmark"></i> Musique : OFF
                        </button>
                        <button onclick="logout()" class="px-3 py-1.5 bg-stone-900 text-amber-200 text-xs rounded-xl border border-amber-900/40">Déconnexion</button>
                    </div>
                </header>
                <div class="flex-1 flex overflow-hidden relative">
                    <aside class="fixed inset-y-0 left-0 z-30 w-72 bg-stone-950/95 border-r border-amber-900/40 transform ${state.sidebar ? 'translate-x-0' : '-translate-x-full'} transition-transform flex flex-col p-5 pt-20 shadow-2xl">
                        <nav class="space-y-1.5 flex-1 overflow-y-auto text-xs">
                            ${!hiddenPages.includes('home') ? sbBtn('home', 'Accueil & QR Code', 'house') : ''}
                            ${!hiddenPages.includes('appreciations') ? sbBtn('appreciations', 'Mes Appréciations', 'award') : ''}
                            ${!hiddenPages.includes('avatar') ? sbBtn('avatar', 'Mon Avatar & Profil', 'user-pen') : ''}
                            ${!hiddenPages.includes('chat') ? sbBtn('chat', 'Messagerie', 'comments') : ''}
                            ${!hiddenPages.includes('calendar') ? sbBtn('calendar', 'Calendrier & Agenda', 'calendar-days') : ''}
                            ${!hiddenPages.includes('quizzes') ? sbBtn('quizzes', 'Quiz & Progression', 'brain') : ''}
                            ${!hiddenPages.includes('orientation') ? sbBtn('orientation', 'Orientation', 'compass') : ''}
                            ${!hiddenPages.includes('revisions') ? sbBtn('revisions', 'Fiches de Révision', 'book-open') : ''}
                            ${!hiddenPages.includes('exams') ? sbBtn('exams', 'Sujets Bac & Exercices', 'graduation-cap') : ''}
                            ${!hiddenPages.includes('notes') ? sbBtn('notes', 'Bloc-Notes', 'note-sticky') : ''}
                            ${!hiddenPages.includes('ideas') ? sbBtn('ideas', 'Boîte à Idées', 'lightbulb') : ''}
                            ${navs}
                            ${user.role === 'admin' ? sbBtn('gemini', 'Gemini AI', 'sparkles', 'text-sky-400 bg-sky-500/10') : ''}
                            ${user.role === 'admin' ? sbBtn('admin', 'Espace Délégué', 'user-gear', 'text-amber-400 bg-amber-500/10') : ''}
                        </nav>
                    </aside>
                    <main class="flex-1 overflow-y-auto p-4 md:p-8">${await renderContent(user)}</main>
                </div>`;
        }

        function sbBtn(id, label, icon, extra = '') {
            let active = state.tab === id;
            return `<button onclick="state.tab='${id}';state.sidebar=false;render()" class="w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 border transition-all ${active ? 'dyn-btn text-white font-bold shadow-lg' : 'text-amber-200/80 bg-stone-900/50 border-transparent hover:bg-stone-900'} ${extra}"><i class="fa-solid fa-${icon}"></i> ${label}</button>`;
        }

        async function renderContent(user) {
            if (state.tab.startsWith('page_')) {
                let cp = (await DB.get('custom_pages', [])).find(x => x.id == state.tab.replace('page_', ''));
                if (!cp) return '';
                return renderCustomPage(cp);
            }
            if (state.tab === 'home') return await renderHome();
            if (state.tab === 'appreciations') return renderUserAppreciations(user);
            if (state.tab === 'chat') return renderChat(user);
            if (state.tab === 'calendar') return renderCalendar(user);
            if (state.tab === 'quizzes') return renderQuizzesTab(user);
            if (state.tab === 'orientation') return renderOrientation(user);
            if (state.tab === 'revisions') return renderDocPage('Fiches de Révision', await DB.get('revision_sheets', []), user);
            if (state.tab === 'exams') return renderDocPage('Sujets Bac & Exercices', await DB.get('exam_subjects', []), user);
            if (state.tab === 'avatar') return renderAvatarPage(user);
            if (state.tab === 'ideas') return renderIdeasPage(user);
            if (state.tab === 'notes') return renderNotesPage(user);
            if (state.tab === 'gemini' && user.role === 'admin') return renderGeminiTab();
            if (state.tab === 'admin' && user.role === 'admin') return renderAdmin(user);
            return '';
        }

        // --- BLOC-NOTES ---
        let autoSaveTimer = null;
        function renderNotesPage(user) {
            let currentNote = localStorage.getItem('leqg_note_'+user.username) || '';
            return `
                <div class="max-w-3xl mx-auto dyn-card border p-6 h-[550px] flex flex-col rounded-3xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-amber-400">Bloc-Notes Personnel</h2>

        function startCountdownsTimer() {
            function update() {
                document.querySelectorAll('.countdown-box').forEach(box => {
                    let targetDate = new Date(box.dataset.date).getTime();
                    let now = new Date().getTime();
                    let diff = targetDate - now;

                    if (diff <= 0) {
                        box.querySelector('.grid').innerHTML = `<div class="col-span-4 text-emerald-400 font-bold text-xs py-2">🎉 L'événement est arrivé !</div>`;
                        return;
                    }

                    let days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    let secs = Math.floor((diff % (1000 * 60)) / 1000);

                    let dEl = box.querySelector('.cd-days');
                    let hEl = box.querySelector('.cd-hours');
                    let mEl = box.querySelector('.cd-mins');
                    let sEl = box.querySelector('.cd-secs');

                    if(dEl) dEl.textContent = days;
                    if(hEl) hEl.textContent = hours;
                    if(mEl) mEl.textContent = mins;
                    if(sEl) sEl.textContent = secs;
                });
            }
            update();
            countdownInterval = setInterval(update, 1000);
        }

        async function loadEmailTemplate(type) {
            let subjectInput = document.getElementById('mail-subject');
            let bodyInput = document.getElementById('mail-body');
            let recipientSelect = document.getElementById('mail-recipient');
            let selectedEmail = recipientSelect.value;
            
            let users = await DB.get('users', []);
            let targetUser = users.find(u => u.email === selectedEmail);
            let name = targetUser ? targetUser.username : "camarade";
            let age = "";
            if (targetUser && targetUser.birthday) {
                let birthYear = parseInt(targetUser.birthday.split('-')[0]);
                age = (new Date().getFullYear() - birthYear) + " ans";
            }

            if (type === 'bday') {
                subjectInput.value = `Joyeux Anniversaire ${name} ! 🎂`;
                bodyInput.value = `Joyeux anniversaire à toi ${name} pour tes ${age || "cette nouvelle année"} ! En espérant que tu passes une magnifique journée.\n\nL'équipe des délégués de la classe.`;
            } else if (type === 'noel') {
                subjectInput.value = "Joyeux Noël 🎄";
                bodyInput.value = `Joyeux Noël ${name} ! Profite bien de ces fêtes de fin d'année et repose-toi bien.\n\nLes délégués.`;
            } else if (type === 'nye') {
                subjectInput.value = "Bonne Année 🎆";
                bodyInput.value = `Excellente année ${name} ! Plein de réussite dans tes projets pour cette nouvelle année.\n\nLes délégués.`;
            }
        }

        function prepareReply(ticket, subject, sender) {
            document.getElementById('mail-ticket-ref').value = ticket;
            document.getElementById('mail-ticket-display').value = ticket;
            document.getElementById('mail-subject').value = subject.replace(/^QG - /, '');
            document.getElementById('mail-body').value = `\n\n--- En réponse à ${sender} ---`;
            showToast("Mode Réponse", `Fil rattaché au ticket ${ticket}`);
        }

        async function sendAdminEmail(e) {
            e.preventDefault();
            let recipient = document.getElementById('mail-recipient').value;
            let subject = "QG - " + document.getElementById('mail-subject').value.trim();
            let text = document.getElementById('mail-body').value.trim();
            let existingTicket = document.getElementById('mail-ticket-ref').value;

            let ticket = existingTicket || ("#QG-" + Math.floor(1000 + Math.random() * 9000));
            let sent = await DB.get('mail_sent', []);

            let mailObj = {
                ticket: ticket,
                recipient: recipient,
                sender: "Délégué (Admin)",
                email: recipient,
                subject: subject,
                text: text,
                date: new Date().toLocaleDateString() + ' à ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            sent.unshift(mailObj);
            await DB.set('mail_sent', sent);

            document.getElementById('mail-subject').value = '';
            document.getElementById('mail-body').value = '';
            document.getElementById('mail-ticket-ref').value = '';
            document.getElementById('mail-ticket-display').value = '';

            showToast("E-mail envoyé", `Message envoyé avec le ticket ${ticket}`);
            render();
        }

        async function saveAsDraft(e) {
            e.preventDefault();
            let subject = document.getElementById('mail-subject').value.trim();
            let text = document.getElementById('mail-body').value.trim();
            if (!subject && !text) return alert("Rien à enregistrer.");

            let ticket = document.getElementById('mail-ticket-ref').value || ("#QG-" + Math.floor(1000 + Math.random() * 9000));
            let drafts = await DB.get('mail_drafts', []);
            drafts.unshift({
                ticket: ticket,
                subject: subject || "Sans objet",
                text: text,
                date: new Date().toLocaleDateString() + ' à ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            await DB.set('mail_drafts', drafts);
            showToast("Brouillon", "Message enregistré en brouillon !");
            render();
        }

        async function archiveMail(boxName, idx) {
            let list = await DB.get('mail_' + boxName, []);
            let archives = await DB.get('mail_archives', []);
            let item = list.splice(idx, 1)[0];
            archives.unshift(item);
            await DB.set('mail_' + boxName, list);
            await DB.set('mail_archives', archives);
            render();
        }

        async function deleteMail(boxName, idx) {
            let list = await DB.get('mail_' + boxName, []);
            list.splice(idx, 1);
            await DB.set('mail_' + boxName, list);
            render();
        }

                { id: 'quizzes', label: 'Quiz & Progression' },
                { id: 'orientation', label: 'Orientation' },
                { id: 'revisions', label: 'Fiches de Révision' },
                { id: 'exams', label: 'Sujets Bac & Exercices' },
                { id: 'notes', label: 'Bloc-Notes' },
                { id: 'ideas', label: 'Boîte à Idées' }
            ];

            return `
                <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                    <h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-eye-slash mr-2"></i>Gestion de la visibilité des pages</h3>
                    <p class="text-xs text-amber-200/60">Coche les pages que tu souhaites masquer pour les élèves.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${defaultPages.map(p => `
                            <label class="p-3 bg-stone-900 border border-amber-900/30 rounded-xl flex items-center justify-between text-xs cursor-pointer">
                                <span class="font-bold text-amber-100">${p.label}</span>
                                <input type="checkbox" ${hiddenPages.includes(p.id) ? 'checked' : ''} onchange="togglePageVisibility('${p.id}')" class="w-4 h-4 text-amber-600 rounded">
                            </label>
                        `).join('')}
                    </div>
                </div>`;
        }

        async function togglePageVisibility(pageId) {
            let hiddenPages = await DB.get('hidden_pages', []);
            if (hiddenPages.includes(pageId)) {
                hiddenPages = hiddenPages.filter(id => id !== pageId);
            } else {
                hiddenPages.push(pageId);
            }
            await DB.set('hidden_pages', hiddenPages);
            showToast("Visibilité", "Mise à jour des pages enregistrée !");
        }

        function renderAdminUsers(users) {
            let students = users.filter(u => u.role !== 'admin');
            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="dyn-card border p-6 space-y-4 rounded-3xl">
                        <h3 class="font-bold text-amber-300 text-sm">Ajouter un Élève</h3>
                        <form onsubmit="createStudentAccount(event)" class="space-y-3">
                            <input type="text" id="nu-user" required placeholder="Identifiant" class="w-full p-2.5 bg-stone-900 border rounded-xl text-xs text-amber-100">
                            <input type="text" id="nu-lastname" required placeholder="Nom de famille" class="w-full p-2.5 bg-stone-900 border rounded-xl text-xs text-amber-100">
                            <input type="email" id="nu-email" placeholder="E-mail (facultatif)" class="w-full p-2.5 bg-stone-900 border rounded-xl text-xs text-amber-100">
                            <input type="password" id="nu-pass" required placeholder="Mot de passe" class="w-full p-2.5 bg-stone-900 border rounded-xl text-xs text-amber-100">
                            <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Créer</button>
                        </form>
                    </div>
                    <div class="md:col-span-2 dyn-card border p-6 space-y-4 rounded-3xl">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-amber-300 text-sm">Élèves Inscrits (${students.length})</h3>
                            <button onclick="exportUsersCSV()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-file-arrow-down"></i> Export CSV</button>
                        </div>
                        <div class="space-y-2 max-h-96 overflow-y-auto">
                            ${students.map(s => `<div class="p-3 bg-stone-900 border rounded-xl flex items-center justify-between text-xs"><div class="flex items-center gap-2">${renderAvatarHtml(s.avatar)}<span><b>${s.username}</b> (${s.lastName || ''} - ${s.email || 'Pas d\'email'})</span></div><button onclick="deleteStudentAccount('${s.username}')" class="px-3 py-1 bg-red-600/30 text-red-300 rounded-lg">Supprimer</button></div>`).join('')}
                        </div>
                    </div>
                </div>`;
        }

        async function exportUsersCSV() {
            let users = await DB.get('users', []);
            let csvContent = "data:text/csv;charset=utf-8,Identifiant;Nom de famille;Email;Mot de passe actuel;Role;Statut;Date de naissance\n";
            users.forEach(u => { let row = [u.username || "", u.lastName || "", u.email || "", u.password || "", u.role || "", u.status || "", u.birthday || ""].join(";"); csvContent += row + "\n"; });
            let encodedUri = encodeURI(csvContent), link = document.createElement("a");
            link.setAttribute("href", encodedUri); link.setAttribute("download", "utilisateurs_le_qg.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            showToast("Export réussi", "Fichier CSV téléchargé !");
        }

        async function renderAdminPagesBuilder() {
            let pages = await DB.get('custom_pages', []);
            return `
                <div class="dyn-card border p-6 space-y-6 rounded-3xl">
                    <h3 class="font-bold text-amber-300 text-sm">Constructeur de Pages Personnalisées</h3>
                    <form onsubmit="createNewCustomPage(event)" class="space-y-4 bg-stone-900 p-6 rounded-2xl border">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" id="cp-title" required placeholder="Titre..." class="p-3 bg-stone-950 border rounded-xl text-xs text-amber-100">
                            <input type="text" id="cp-subtitle" placeholder="Sous-titre..." class="p-3 bg-stone-950 border rounded-xl text-xs text-amber-100">
                            <input type="text" id="cp-icon" placeholder="Icône FontAwesome (ex: bus)" class="p-3 bg-stone-950 border rounded-xl text-xs text-amber-100" value="file-lines">
                        </div>
                        <button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Créer la page</button>
                    </form>
                    <div class="space-y-4 pt-4 border-t">
                        ${pages.map((p, idx) => `
                            <div class="dyn-card border p-5 rounded-2xl space-y-4">
                                <div class="flex justify-between items-center"><h5 class="font-bold text-amber-100 text-sm"><i class="fa-solid fa-${p.icon || 'file-lines'} mr-2"></i>${p.title}</h5><button onclick="deleteCustomPage(${idx})" class="px-3 py-1 bg-red-600/30 text-red-300 rounded-lg text-xs font-bold">Supprimer</button></div>
                                <div class="space-y-2">${p.elements && p.elements.length > 0 ? p.elements.map((el, elIdx) => `<div class="p-2 bg-stone-950 border rounded-xl flex justify-between items-center text-xs"><span><b>[${el.type.toUpperCase()}]</b> ${el.title || el.label || el.content.substring(0, 30)}</span><button onclick="deletePageElement(${p.id}, ${elIdx})" class="text-red-400">Supprimer</button></div>`).join('') : '<p class="text-xs text-amber-200/40 italic">Vide.</p>'}</div>
                                <div class="flex gap-2 flex-wrap"><button onclick="openAddElementModal(${p.id}, 'text')" class="px-3 py-1.5 bg-stone-900 border text-xs rounded-xl">+ Texte</button><button onclick="openAddElementModal(${p.id}, 'button')" class="px-3 py-1.5 bg-stone-900 border text-xs rounded-xl">+ Bouton</button><button onclick="openAddElementModal(${p.id}, 'file')" class="px-3 py-1.5 bg-stone-900 border text-xs rounded-xl">+ Fichier</button><button onclick="openAddElementModal(${p.id}, 'audio')" class="px-3 py-1.5 bg-stone-900 border text-xs rounded-xl">+ Audio</button></div>
                            </div>`).join('')}
                    </div>
                </div>
                <div id="add-element-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="w-full max-w-md dyn-card border p-6 rounded-3xl space-y-4">
                        <h3 id="modal-el-title" class="font-bold text-amber-400 text-sm">Ajouter</h3>
                        <form onsubmit="submitPageElement(event)" class="space-y-3">
                            <input type="hidden" id="modal-page-id"><input type="hidden" id="modal-el-type">
                            <div id="modal-fields-container" class="space-y-3"></div>
                            <div class="flex gap-2 pt-2"><button type="submit" class="flex-1 py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Ajouter</button><button type="button" onclick="toggleModal('add-element-modal', false)" class="px-4 py-2.5 bg-stone-900 text-amber-200 rounded-xl text-xs">Annuler</button></div>
                        </form>
                    </div>
                </div>`;
        }

        async function createNewCustomPage(e) {
            e.preventDefault();
            let title = document.getElementById('cp-title').value.trim(), subtitle = document.getElementById('cp-subtitle').value.trim(), icon = document.getElementById('cp-icon').value.trim() || 'file-lines';
            let pages = await DB.get('custom_pages', []); pages.push({ id: Date.now(), title, subtitle, icon, elements: [] });
            await DB.set('custom_pages', pages); showToast("Succès", "Page créée !"); render();
        }

        async function deleteCustomPage(idx) {
            if(!confirm("Supprimer ?")) return; let pages = await DB.get('custom_pages', []); pages.splice(idx, 1); await DB.set('custom_pages', pages); render();
        }

        function openAddElementModal(pageId, type) {
            document.getElementById('modal-page-id').value = pageId; document.getElementById('modal-el-type').value = type;
            let container = document.getElementById('modal-fields-container');
            if (type === 'text') container.innerHTML = `<textarea id="el-content" required placeholder="Texte..." class="w-full h-32 p-3 bg-stone-950 border rounded-xl text-xs text-amber-100"></textarea>`;
            else if (type === 'button') container.innerHTML = `<input type="text" id="el-label" required placeholder="Texte..." class="w-full p-3 bg-stone-950 border rounded-xl text-xs text-amber-100"><input type="url" id="el-url" required placeholder="URL..." class="w-full p-3 bg-stone-950 border rounded-xl text-xs text-amber-100">`;
            else if (type === 'file') container.innerHTML = `<input type="text" id="el-title" required placeholder="Nom..." class="w-full p-3 bg-stone-950 border rounded-xl text-xs text-amber-100"><input type="file" id="el-file-input" required class="w-full p-2 bg-stone-950 border rounded-xl text-xs">`;
            else if (type === 'audio') container.innerHTML = `<input type="text" id="el-title" required placeholder="Titre..." class="w-full p-3 bg-stone-950 border rounded-xl text-xs text-amber-100"><input type="file" id="el-audio-input" required accept="audio/*" class="w-full p-2 bg-stone-950 border rounded-xl text-xs">`;
            toggleModal('add-element-modal', true);
        }

        async function submitPageElement(e) {
            e.preventDefault(); let pageId = parseInt(document.getElementById('modal-page-id').value), type = document.getElementById('modal-el-type').value;
            let pages = await DB.get('custom_pages', []), page = pages.find(p => p.id === pageId); if (!page) return; if (!page.elements) page.elements = [];
            if (type === 'text') { page.elements.push({ type: 'text', content: document.getElementById('el-content').value }); finalizeElementAdd(pages); }
            else if (type === 'button') { page.elements.push({ type: 'button', label: document.getElementById('el-label').value, url: document.getElementById('el-url').value }); finalizeElementAdd(pages); }
            else if (type === 'file') { let title = document.getElementById('el-title').value, fileInput = document.getElementById('el-file-input'), reader = new FileReader(); reader.onload = async (ev) => { page.elements.push({ type: 'file', title, fileData: ev.target.result, fileType: fileInput.files[0].type }); finalizeElementAdd(pages); }; reader.readAsDataURL(fileInput.files[0]); }
            else if (type === 'audio') { let title = document.getElementById('el-title').value, audioInput = document.getElementById('el-audio-input'), reader = new FileReader(); reader.onload = async (ev) => { page.elements.push({ type: 'audio', title, audioData: ev.target.result, audioType: audioInput.files[0].type }); finalizeElementAdd(pages); }; reader.readAsDataURL(audioInput.files[0]); }
        }

        async function finalizeElementAdd(pages) { await DB.set('custom_pages', pages); toggleModal('add-element-modal', false); showToast("Succès", "Élément ajouté !"); render(); }
        async function deletePageElement(pageId, elIdx) { let pages = await DB.get('custom_pages', []), page = pages.find(p => p.id === pageId); if (page) { page.elements.splice(elIdx, 1); await DB.set('custom_pages', pages); render(); } }

        async function renderAdminQuizzes() {
            let quizzes = await DB.get('quizzes', []);
            return `<div class="dyn-card border p-6 space-y-6 rounded-3xl"><h3 class="font-bold text-amber-300 text-sm">Créer un Quiz</h3><form onsubmit="createQuiz(event)" class="space-y-4"><input type="text" id="qz-title" required placeholder="Titre..." class="w-full p-3 bg-stone-900 border rounded-xl text-xs text-amber-100"><div id="quiz-questions-container" class="space-y-4"><div class="p-4 bg-stone-900 border rounded-2xl space-y-3 q-block"><p class="font-bold text-xs text-amber-400">Question 1</p><input type="text" placeholder="Intitulé..." class="q-text w-full p-2.5 bg-stone-950 border rounded-xl text-xs" required><div class="grid grid-cols-2 gap-2"><input type="text" placeholder="Option A" class="q-opt-0 w-full p-2 bg-stone-950 rounded text-xs" required><input type="text" placeholder="Option B" class="q-opt-1 w-full p-2 bg-stone-950 rounded text-xs" required><input type="text" placeholder="Option C" class="q-opt-2 w-full p-2 bg-stone-950 rounded text-xs"><input type="text" placeholder="Option D" class="q-opt-3 w-full p-2 bg-stone-950 rounded text-xs"></div><input type="number" min="0" max="3" value="0" class="q-correct w-20 p-2 bg-stone-950 rounded text-xs" required></div></div><button type="button" onclick="addQuizQuestionField()" class="px-4 py-2 bg-stone-900 border text-amber-200 rounded-xl text-xs font-bold">+ Question</button><button type="submit" class="w-full py-3 dyn-btn text-white font-bold rounded-xl text-xs">Publier</button></form></div>`;
        }

        function addQuizQuestionField() {
            let container = document.getElementById('quiz-questions-container'), count = container.children.length + 1, div = document.createElement('div');
            div.className = "p-4 bg-stone-900 border rounded-2xl space-y-3 q-block";
            div.innerHTML = `<p class="font-bold text-xs text-amber-400">Question ${count}</p><input type="text" placeholder="Intitulé..." class="q-text w-full p-2.5 bg-stone-950 border rounded-xl text-xs" required><div class="grid grid-cols-2 gap-2"><input type="text" placeholder="Option A" class="q-opt-0 w-full p-2 bg-stone-950 rounded text-xs" required><input type="text" placeholder="Option B" class="q-opt-1 w-full p-2 bg-stone-950 rounded text-xs" required><input type="text" placeholder="Option C" class="q-opt-2 w-full p-2 bg-stone-950 rounded text-xs"><input type="text" placeholder="Option D" class="q-opt-3 w-full p-2 bg-stone-950 rounded text-xs"></div><input type="number" min="0" max="3" value="0" class="q-correct w-20 p-2 bg-stone-950 rounded text-xs" required>`;
            container.appendChild(div);
        }

        async function createQuiz(e) {
            e.preventDefault(); let title = document.getElementById('qz-title').value.trim(), qBlocks = document.querySelectorAll('.q-block'), questions = [];
            qBlocks.forEach(b => { let qText = b.querySelector('.q-text').value.trim(), opts = [b.querySelector('.q-opt-0').value.trim(), b.querySelector('.q-opt-1').value.trim(), b.querySelector('.q-opt-2').value.trim(), b.querySelector('.q-opt-3').value.trim()].filter(o => o !== ''), correct = parseInt(b.querySelector('.q-correct').value); if (qText && opts.length > 0) questions.push({ question: qText, options: opts, correct: correct }); });
            let quizzes = await DB.get('quizzes', []); quizzes.push({ id: Date.now(), title, questions }); await DB.set('quizzes', quizzes); showToast("Succès", "Quiz publié !"); render();
        }

        async function renderAdminSurveillance() {
            let messages = await DB.get('messages', []), privates = messages.filter(m => m.type === 'private');
            return `<div class="dyn-card border p-6 space-y-4 rounded-3xl"><h3 class="font-bold text-amber-300 text-sm"><i class="fa-solid fa-user-secret mr-2"></i>Surveillance des Messages Privés</h3><div class="space-y-3 max-h-96 overflow-y-auto">${privates.length > 0 ? privates.map(m => `<div class="p-3 bg-stone-900 border rounded-2xl text-xs space-y-1"><div class="flex justify-between text-[10px] text-amber-400 font-bold"><span>De : ${m.sender} ➔ À : ${m.recipient}</span><span>${m.time}</span></div><p class="text-amber-100">${m.text}</p></div>`).join('') : '<p class="text-xs text-amber-200/40 italic">Aucun message.</p>'}</div></div>`;
        }

        async function renderAdminAppreciations(users, appreciations) {
            let students = users.filter(u => u.role !== 'admin');
            return `<div class="dyn-card border p-6 space-y-4 rounded-3xl"><h3 class="font-bold text-amber-300 text-sm">Appréciations</h3><div class="overflow-x-auto"><table class="w-full text-left text-xs text-amber-100"><thead><tr class="border-b text-amber-400"><th class="p-2">Élève</th><th class="p-2">T1</th><th class="p-2">T2</th><th class="p-2">T3</th><th class="p-2">Publier</th><th class="p-2">Action</th></tr></thead><tbody>${students.map(s => { let app = appreciations[s.username] || { t1: '', t2: '', t3: '', published: false }; return `<tr class="border-b"><td class="p-2 font-bold">${s.username}</td><td class="p-2"><textarea id="app_t1_${s.username}" class="w-full p-1 bg-stone-900 rounded">${app.t1||''}</textarea></td><td class="p-2"><textarea id="app_t2_${s.username}" class="w-full p-1 bg-stone-900 rounded">${app.t2||''}</textarea></td><td class="p-2"><textarea id="app_t3_${s.username}" class="w-full p-1 bg-stone-900 rounded">${app.t3||''}</textarea></td><td class="p-2 text-center"><input type="checkbox" id="app_pub_${s.username}" ${app.published?'checked':''}></td><td class="p-2"><button onclick="saveStudentAppreciation('${s.username}')" class="px-2.5 py-1 dyn-btn text-white rounded font-bold">OK</button></td></tr>`; }).join('')}</tbody></table></div></div>`;
        }

        async function saveStudentAppreciation(username) {
            let appreciations = await DB.get('appreciations', {});
            appreciations[username] = { t1: document.getElementById(`app_t1_${username}`).value, t2: document.getElementById(`app_t2_${username}`).value, t3: document.getElementById(`app_t3_${username}`).value, published: document.getElementById(`app_pub_${username}`).checked };
            await DB.set('appreciations', appreciations); showToast("Enregistré", "Appréciations mises à jour !");
        }

        async function renderAdminCalendar() {
            let adminEvents = await DB.get('admin_calendar', []);
            return `<div class="dyn-card border p-6 space-y-4 rounded-3xl"><h3 class="font-bold text-amber-300 text-sm">Agenda Commun</h3><form onsubmit="addAdminCalendarEvent(event)" class="space-y-3"><input type="text" id="admin-ev-title" required placeholder="Titre..." class="w-full p-3 bg-stone-900 border rounded-xl text-xs"><input type="date" id="admin-ev-date" required class="w-full p-3 bg-stone-900 border rounded-xl text-xs"><button type="submit" class="w-full py-2.5 dyn-btn text-white font-bold rounded-xl text-xs">Ajouter</button></form></div>`;
        }

        async function addAdminCalendarEvent(e) {
            e.preventDefault(); let title = document.getElementById('admin-ev-title').value, date = document.getElementById('admin-ev-date').value;
            let events = await DB.get('admin_calendar', []); events.push({ id: Date.now(), title, date }); await DB.set('admin_calendar', events); render();
        }

        async function createStudentAccount(e) {
            e.preventDefault(); let username = document.getElementById('nu-user').value.trim(), lastName = document.getElementById('nu-lastname').value.trim(), email = document.getElementById('nu-email').value.trim(), password = document.getElementById('nu-pass').value.trim();
            let users = await DB.get('users', []); if (users.some(u => u.username === username)) return alert("Existe déjà.");
            users.push({ username, lastName, email, password, role: 'student', status: 'active', avatar: { base: '🎓', style: 'bg-amber-600', accessory: '⭐' }, mustChangePass: true, birthday: '' });
            await DB.set('users', users); render();
        }

        async function deleteStudentAccount(username) {
            if(!confirm("Supprimer ?")) return; let users = await DB.get('users', []); users = users.filter(u => u.username !== username); await DB.set('users', users); render();
        }

        async function handleLogin(e) {
            e.preventDefault(); let u = document.getElementById('l-user').value.trim(), p = document.getElementById('l-pass').value.trim();
            let users = await DB.get('users', []), user = users.find(x => x.username === u && x.password === p);
            if (user) { localStorage.setItem('leqg_current_user', JSON.stringify(user)); render(); } else { alert("Identifiant ou mot de passe incorrect"); }
        }

        async function saveSetup(e) {
            e.preventDefault(); 
            let lastName = document.getElementById('s-lastname').value.trim();
            let email = document.getElementById('s-email').value.trim();
            let pass = document.getElementById('s-pass').value;
            let bday = document.getElementById('s-bday').value;
            let user = getCurrentUser(), users = await DB.get('users', []), idx = users.findIndex(u => u.username === user.username);
            if (idx !== -1) { 
                users[idx].lastName = lastName; 
                users[idx].email = email; 
                users[idx].password = pass; 
                users[idx].birthday = bday; 
                users[idx].mustChangePass = false; 
                await DB.set('users', users); 
                localStorage.setItem('leqg_current_user', JSON.stringify(users[idx])); 
                render(); 
            }
        }

        function logout() { localStorage.removeItem('leqg_current_user'); render(); }
        window.onload = init;
    </script>
</body>
</html>
